<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Analyzer</title>
  <style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#1e293b);color:#f8fafc;min-height:100vh}.container{width:min(760px,92%);margin:40px auto}.card{background:#0f172a;border:1px solid #334155;border-radius:20px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.badge{font-size:12px;letter-spacing:1px;color:#93c5fd;margin-bottom:12px}h1{margin:0 0 8px;font-size:34px}.subtitle{color:#94a3b8;margin-top:0}.input-row,.generated{display:flex;gap:10px;margin:24px 0}.input-row input,.generated input{flex:1;padding:14px;border-radius:10px;border:1px solid #475569;background:#020617;color:white;font-size:16px}.input-row button,.generated button,.primary{border:0;border-radius:10px;padding:0 18px;background:#334155;color:white;cursor:pointer}.primary{padding:13px 18px;background:#2563eb;margin:12px 0}.meter{height:10px;background:#334155;border-radius:99px;overflow:hidden}.meter div{height:100%;width:0;transition:.25s}.score-line{display:flex;justify-content:space-between;margin:10px 0 18px;font-weight:bold}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{padding:10px;background:#1e293b;border-radius:9px}.good{color:#86efac}.bad{color:#fca5a5}.suggestions{margin-top:16px;padding:14px;background:#172033;border-radius:10px}.suggestions ul{margin:8px 0 0;padding-left:20px;color:#cbd5e1}.generator{margin-top:20px}.generator-controls{display:flex;flex-wrap:wrap;gap:14px;color:#cbd5e1}.generator-controls label{font-size:14px}.note{font-size:12px;color:#64748b;margin-top:20px}@media(max-width:600px){.checks{grid-template-columns:1fr}.card{padding:20px}h1{font-size:27px}}</style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="badge">ANDROPEDIA • TECHNICAL RECRUITMENT 2026</div>
      <h1>Password Strength Analyzer</h1>
      <p class="subtitle">Check password quality, understand weaknesses, and generate a stronger password.</p>

      <div class="input-row">
        <input id="password" type="password" autocomplete="off" placeholder="Enter a password">
        <button id="toggleBtn" type="button">Show</button>
      </div>

      <div class="meter"><div id="meterFill"></div></div>
      <div class="score-line">
        <span id="strength">Enter a password</span>
        <span id="score">0/100</span>
      </div>

      <div id="checks" class="checks"></div>
      <div id="suggestions" class="suggestions"></div>

      <hr>

      <div class="generator">
        <h2>Strong Password Generator</h2>
        <div class="generator-controls">
          <label>Length <input id="length" type="number" min="8" max="32" value="16"></label>
          <label><input id="upper" type="checkbox" checked> Uppercase</label>
          <label><input id="lower" type="checkbox" checked> Lowercase</label>
          <label><input id="numbers" type="checkbox" checked> Numbers</label>
          <label><input id="symbols" type="checkbox" checked> Symbols</label>
        </div>
        <button id="generateBtn" class="primary" type="button">Generate Password</button>
        <div class="generated">
          <input id="generatedPassword" readonly placeholder="Generated password">
          <button id="copyBtn" type="button">Copy</button>
        </div>
      </div>

      <p class="note">For demonstration only. Do not enter passwords you actually use.</p>
    </section>
  </main>
  <script>const passwordInput = document.getElementById("password");
const toggleBtn = document.getElementById("toggleBtn");
const meterFill = document.getElementById("meterFill");
const strengthEl = document.getElementById("strength");
const scoreEl = document.getElementById("score");
const checksEl = document.getElementById("checks");
const suggestionsEl = document.getElementById("suggestions");

const commonPasswords = new Set([
  "password", "password123", "123456", "123456789", "qwerty",
  "qwerty123", "admin", "letmein", "welcome", "abc123", "iloveyou"
]);

const sequences = [
  "123456", "234567", "345678", "abcdef", "bcdefg",
  "qwerty", "654321", "fedcba"
];

toggleBtn.addEventListener("click", () => {
  const hidden = passwordInput.type === "password";
  passwordInput.type = hidden ? "text" : "password";
  toggleBtn.textContent = hidden ? "Hide" : "Show";
});

passwordInput.addEventListener("input", () => analyze(passwordInput.value));

function getPoolSize(password) {
  let pool = 0;
  if (/[a-z]/.test(password)) pool += 26;
  if (/[A-Z]/.test(password)) pool += 26;
  if (/[0-9]/.test(password)) pool += 10;
  if (/[^A-Za-z0-9]/.test(password)) pool += 33;
  return pool;
}

function formatCrackTime(seconds) {
  if (seconds < 1) return "Less than 1 second";
  if (seconds > 315576000000000) return "Extremely long";

  const units = [
    ["year", 31557600],
    ["day", 86400],
    ["hour", 3600],
    ["minute", 60],
    ["second", 1]
  ];

  for (const [name, size] of units) {
    if (seconds >= size) {
      const value = Math.floor(seconds / size);
      return `${value.toLocaleString()} ${name}${value === 1 ? "" : "s"}`;
    }
  }
}

function analyze(password) {
  if (!password) {
    strengthEl.textContent = "Enter a password";
    scoreEl.textContent = "0/100";
    meterFill.style.width = "0";
    checksEl.innerHTML = "";
    suggestionsEl.innerHTML = "";
    return;
  }

  const repeated = /(.)\1\1/.test(password);
  const predictable = sequences.some(
    sequence => password.toLowerCase().includes(sequence)
  );
  const common = commonPasswords.has(password.toLowerCase());

  const tests = [
    ["At least 12 characters", password.length >= 12],
    ["Uppercase letters", /[A-Z]/.test(password)],
    ["Lowercase letters", /[a-z]/.test(password)],
    ["Numbers", /[0-9]/.test(password)],
    ["Special characters", /[^A-Za-z0-9]/.test(password)],
    ["No excessive repetition", !repeated],
    ["No predictable sequence", !predictable],
    ["Not a common password", !common]
  ];

  let score = password.length >= 16 ? 30 :
              password.length >= 12 ? 25 :
              password.length >= 8 ? 15 : 5;

  score += /[A-Z]/.test(password) ? 10 : 0;
  score += /[a-z]/.test(password) ? 10 : 0;
  score += /[0-9]/.test(password) ? 10 : 0;
  score += /[^A-Za-z0-9]/.test(password) ? 15 : 0;
  score += repeated ? -10 : 10;
  score += predictable ? -10 : 10;
  score += common ? -20 : 10;

  score = Math.max(0, Math.min(100, score));

  const strength = score >= 70 ? "STRONG" :
                   score >= 40 ? "MEDIUM" : "WEAK";

  strengthEl.textContent = `Password Strength: ${strength}`;
  scoreEl.textContent = `${score}/100`;
  meterFill.style.width = `${score}%`;
  meterFill.style.background =
    strength === "STRONG" ? "#22c55e" :
    strength === "MEDIUM" ? "#eab308" : "#ef4444";

  checksEl.innerHTML = tests.map(([label, ok]) =>
    `<div class="check ${ok ? "good" : "bad"}">${ok ? "✓" : "✗"} ${label}</div>`
  ).join("");

  const suggestions = [];
  if (password.length < 12) suggestions.push("Use at least 12 characters.");
  if (!/[A-Z]/.test(password)) suggestions.push("Add uppercase letters.");
  if (!/[a-z]/.test(password)) suggestions.push("Add lowercase letters.");
  if (!/[0-9]/.test(password)) suggestions.push("Add numbers.");
  if (!/[^A-Za-z0-9]/.test(password)) suggestions.push("Add special characters.");
  if (repeated) suggestions.push("Avoid long repeated characters.");
  if (predictable) suggestions.push("Avoid predictable sequences such as 123456 or abcdef.");
  if (common) suggestions.push("Avoid common passwords.");

  suggestionsEl.innerHTML = suggestions.length
    ? `<strong>Suggestions:</strong><ul>${suggestions.map(s => `<li>${s}</li>`).join("")}</ul>`
    : "<strong>Suggestions:</strong> Good job. Keep passwords unique and never reuse them.";
}

document.getElementById("generateBtn").addEventListener("click", () => {
  const length = Math.max(
    8,
    Math.min(32, Number(document.getElementById("length").value) || 16)
  );

  const sets = [];
  if (document.getElementById("upper").checked) sets.push("ABCDEFGHJKLMNPQRSTUVWXYZ");
  if (document.getElementById("lower").checked) sets.push("abcdefghijkmnopqrstuvwxyz");
  if (document.getElementById("numbers").checked) sets.push("23456789");
  if (document.getElementById("symbols").checked) sets.push("!@#$%^&*()-_=+");

  if (!sets.length) {
    alert("Select at least one character type.");
    return;
  }

  const chars = sets.map(set => set[Math.floor(Math.random() * set.length)]);
  const all = sets.join("");

  while (chars.length < length) {
    chars.push(all[Math.floor(Math.random() * all.length)]);
  }

  for (let i = chars.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [chars[i], chars[j]] = [chars[j], chars[i]];
  }

  document.getElementById("generatedPassword").value = chars.join("");
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const value = document.getElementById("generatedPassword").value;
  if (!value) return;

  try {
    await navigator.clipboard.writeText(value);
    document.getElementById("copyBtn").textContent = "Copied!";
    setTimeout(() => {
      document.getElementById("copyBtn").textContent = "Copy";
    }, 1200);
  } catch {
    alert("Copy is unavailable. Select and copy the generated password manually.");
  }
});
</script>
</body>
</html>
